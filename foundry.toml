[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./config" }, { access = "read", path = "./test/data" }, { access = "read", path = "./test/vectors" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1024
depth = 256

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
