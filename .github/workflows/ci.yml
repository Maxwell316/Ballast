name: ci
on: [push, pull_request]
env:
  FOUNDRY_PROFILE: ci
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format
        run: forge fmt --check
      - name: Build and sizes
        run: forge build --sizes --skip "test/**" --skip "script/**"
      - name: Tests
        run: forge test -vvv
      - name: Coverage gate (all of src/, from the end of M2)
        env:
          FOUNDRY_PROFILE: coverage # instrumented runs with CI-profile fuzz counts would take far too long
        run: |
          # Gas budgets and bytecode sizes are only meaningful for the optimised build; they run in the Tests step above.
          # The instrumented run starved the hosted runner ("lost communication") once the ordering x construction matrix and
          # the differential fuzz existed: coverage keeps one variant per ordering (C0Before, C1After) and drops the heavy
          # differential, which runs in the Tests step.
          forge coverage --ir-minimum --report lcov --no-match-path "test/{fork,gas}/*" --no-match-contract "SizesTest|LensDifferentialTest|_C0After|_C1Before"
          python3 tools/coverage_gate.py lcov.info src/ --lines 95 --branches 90
      - name: Compliance report
        run: python3 tools/compliance.py --check
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install slither-analyzer
      # Informational findings are triaged in docs/SLITHER_NOTES.md and must not fail the job; low and above do.
      - run: slither . --config-file slither.config.json --fail-low
