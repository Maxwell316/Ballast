name: ci
on: [push, pull_request]
env:
  FOUNDRY_PROFILE: ci
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format
        run: forge fmt --check
      - name: Build and sizes
        run: forge build --sizes --skip "test/**" --skip "script/**"
      - name: Tests
        run: forge test -vvv
      - name: Coverage gate (all of src/, from the end of M2)
        env:
          FOUNDRY_PROFILE: default # instrumented runs with CI-profile fuzz counts would take far too long
        run: |
          forge coverage --report lcov --no-match-path "test/fork/*"
          python3 tools/coverage_gate.py lcov.info src/ --lines 95 --branches 90
      - name: Compliance report
        run: python3 tools/compliance.py
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install slither-analyzer
      # Informational findings are triaged in docs/SLITHER_NOTES.md and must not fail the job; low and above do.
      - run: slither . --config-file slither.config.json --fail-low
